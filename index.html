<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La nueva edición del torneo guinda smash del cecyt 13!" />
    <meta name="theme-color" content="#3f0d1d" />
    <title>New Guinda Smash (3ra Edición)</title>
    <style>
      :root {
        color-scheme: dark;
        --vino-950: #22070f;
        --vino-900: #2f0a16;
        --vino-700: #571628;
        --marfil: #f8f1e8;
        --marfil-suave: #dbcdbf;
        --borde: #e6d2bb40;
        --panel: #1f0b11cc;
        --focus: #f9cd85;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--marfil);
        background-color: var(--vino-900);
        display: grid;
        place-items: center;
        padding: clamp(1rem, 2.5vw, 2rem);
        position: relative;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url("assets/guinda-bg.jpg");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(180deg, #22070fd9 0%, #2f0a16e6 45%, #16060ccf 100%);
      }

      main {
        width: min(760px, 100%);
      }

      .hero {
        border: 1px solid var(--borde);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 0 20px 45px #00000073;
        padding: clamp(1.5rem, 3.2vw, 2.75rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.2rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 1rem 0 0;
        max-width: 58ch;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: clamp(1rem, 2.35vw, 1.1rem);
        line-height: 1.65;
        color: #efe3d5;
      }

      .actions {
        margin-top: 1.75rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.85rem;
      }

      .cta {
        display: block;
        border-radius: 0;
        padding: 0.95rem 1rem;
        text-decoration: none;
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.35;
        font-size: 1rem;
        border: 1px solid transparent;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .cta-primary {
        background: #f2dcc1;
        color: #3e0f1d;
        border-color: #f6e6d2;
      }

      .cta-secondary {
        color: var(--marfil);
        background: transparent;
        border-color: #f1dfc680;
      }

      .cta:hover {
        transform: translateY(-1px);
      }

      .cta-primary:hover {
        box-shadow: 0 12px 22px #0000004d;
      }

      .cta-secondary:hover {
        border-color: #f5e6d4;
        background: #f4e7d414;
      }

      .cta:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      @media (max-width: 520px) {
        .actions {
          grid-template-columns: 1fr;
        }

        body::before {
          background-position: center top;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="hero" aria-labelledby="titulo-evento">
        <h1 id="titulo-evento">New Guinda Smash (3ra Edición)</h1>
        <p class="subtitle">La nueva edición del torneo guinda smash del cecyt 13!</p>

        <nav class="actions" aria-label="Enlaces oficiales del evento">
          <a class="cta cta-primary" href="https://www.start.gg/tournament/new-guinda-smash-3ra-edici-n-1/details" target="_blank" rel="noopener noreferrer">
            Inscripción
          </a>
          <a class="cta cta-secondary" href="https://chat.whatsapp.com/HMRJ8bpcsVL492NW7xqJMW" target="_blank" rel="noopener noreferrer">
            grupo de whatsapp
          </a>
        </nav>
      </article>
    </main>
  </body>
</html>
