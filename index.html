<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guinda Smash | Enlaces</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #1a0a2e;
        --bg-2: #2d1047;
        --card: #ffffff14;
        --text: #f8f5ff;
        --accent: #ff4fa3;
        --accent-2: #ff8a00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
        color: var(--text);
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid #ffffff2a;
        border-radius: 22px;
        padding: 36px 28px;
        text-align: center;
        backdrop-filter: blur(4px);
        box-shadow: 0 20px 40px #00000045;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      p {
        margin: 14px auto 0;
        max-width: 52ch;
        line-height: 1.55;
        opacity: 0.9;
      }

      .links {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }

      a {
        text-decoration: none;
        color: var(--text);
        border: 1px solid #ffffff3a;
        border-radius: 14px;
        padding: 18px 14px;
        font-weight: 700;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      a:first-child {
        background: linear-gradient(120deg, #7b2cff, var(--accent));
        border-color: #ffffff57;
      }

      a:last-child {
        background: linear-gradient(120deg, #ff6b00, var(--accent-2));
        border-color: #ffffff57;
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-3px);
        border-color: #fff;
      }

      .note {
        margin-top: 18px;
        font-size: 0.9rem;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Guinda Smash</h1>
      <p>
        Escaneaste un solo QR con dos destinos. Elige si quieres entrar al torneo en start.gg o unirte a la comunidad de WhatsApp para resolver dudas.
      </p>

      <section class="links" aria-label="Enlaces principales">
        <a href="https://www.start.gg/" target="_blank" rel="noopener noreferrer">Ver torneo en start.gg</a>
        <a href="https://chat.whatsapp.com/" target="_blank" rel="noopener noreferrer">Entrar a la comunidad de WhatsApp</a>
      </section>

      <p class="note">Puedes reemplazar ambos enlaces por los oficiales cuando los tengas.</p>
    </main>
  </body>
</html>
